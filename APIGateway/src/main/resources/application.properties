spring.application.name=api-gateway
server.port = 8080

# Eureka Configuration
eureka.client.service-url.defaultZone= http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Increasing timeout values for gateway routes
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=5000

# Route configurations
spring.cloud.gateway.routes[0].id=users-service
spring.cloud.gateway.routes[0].uri=lb://users-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/users/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/v1/users/(?<segment>.*), /users/${segment}

spring.cloud.gateway.routes[1].id=posts-service
spring.cloud.gateway.routes[1].uri=lb://posts-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/posts/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/v1/posts/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[2].id=connections-service
spring.cloud.gateway.routes[2].uri=lb://connections-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/connections/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/v1/connections/(?<segment>.*), /${segment}

# Logging for troubleshooting
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=DEBUG
