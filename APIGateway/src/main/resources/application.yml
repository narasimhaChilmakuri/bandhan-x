spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 30000
        response-timeout: 30000
      routes:
        - id: users-service
          uri: lb://users-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=2

        - id: posts-service
          uri: lb://posts-service
          predicates:
            - Path=/api/v1/posts/**
          filters:
            - StripPrefix=2
            - -name: AuthenticationFilter

        - id: connections-service
          uri: lb://connections-service
          predicates:
            - Path=/api/v1/connections/**
          filters:
            - StripPrefix=2
            - -name: AuthenticationFilter

ribbon:
  ConnectTimeout: 30000
  ReadTimeout: 30000
  eager-load:
    enabled: true

hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 60000

server:
  port: 8080

jwt:
  secretKey: asdfuasjf9a8s7fd89ihq34kljruyf98ayshcskdhfioafsuyfdcjha890sduf

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
