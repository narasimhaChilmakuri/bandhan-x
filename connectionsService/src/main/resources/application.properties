spring.application.name=connections-service

server.port = 9030
server.servlet.context-path=/api/v1/connections

spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=neopassword

eureka.client.service-url.defaultZone= http://localhost:8761/eureka

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=192.168.1.10
eureka.instance.instance-id=${eureka.instance.ip-address}:${spring.application.name}:${server.port}