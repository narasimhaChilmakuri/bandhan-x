spring.application.name=posts-service

server.servlet.context-path=/api/v1/posts
server.port=9010

spring.datasource.url=jdbc:postgresql://localhost:5432/postsDB
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update


eureka.client.service-url.defaultZone= http://localhost:8761/eureka

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=192.168.1.10
eureka.instance.instance-id=${eureka.instance.ip-address}:${spring.application.name}:${server.port}